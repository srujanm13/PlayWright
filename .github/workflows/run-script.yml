name: Run JavaScript Script

on:
  push:
    branches: [ "main" ] # Triggers automatically when pushing to main
  workflow_dispatch:      # Allows you to trigger it manually from GitHub UI

jobs:
  run-js:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the project repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js runtime environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install project dependencies (if package.json exists)
      - name: Install dependencies
        run: npm ci || npm install
      #4. 
      - name: Run script
        env:
          test: ${{ secrets.QA }}
        run: node ../tests/pac.js
